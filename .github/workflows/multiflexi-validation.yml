name: MultiFlexi JSON Validation

on:
  push:
    paths:
      - 'multiflexi/*.json'
  pull_request:
    paths:
      - 'multiflexi/*.json'

jobs:
  validate-multiflexi-json:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
        
    - name: Install jsonschema
      run: pip install jsonschema requests
      
    - name: Validate JSON syntax
      run: |
        for file in multiflexi/*.json; do
          if [ -f "$file" ]; then
            echo "Validating syntax: $file"
            python3 -m json.tool "$file" > /dev/null
          fi
        done
        
    - name: Validate against MultiFlexi schema
      run: |
        python3 << 'EOF'
        import json
        import requests
        import jsonschema
        import os
        import glob

        # Download schemas — file naming picks which schema applies:
        #   *.multiflexi.app.json           -> schema/application.json
        #   *.multiflexi.crdprototype.json  -> schema/credential-prototype.json
        base_url = "https://raw.githubusercontent.com/VitexSoftware/php-vitexsoftware-multiflexi-core/refs/heads/main/schema"
        schemas = {}
        for suffix, schema_file in (
            (".multiflexi.app.json", "application.json"),
            (".multiflexi.crdprototype.json", "credential-prototype.json"),
        ):
            response = requests.get(f"{base_url}/{schema_file}")
            response.raise_for_status()
            schemas[suffix] = response.json()

        # Validate all JSON files
        for file_path in glob.glob("multiflexi/*.json"):
            schema = next((s for suffix, s in schemas.items() if file_path.endswith(suffix)), None)
            if schema is None:
                print(f"⚠️ {file_path} does not match any known MultiFlexi file suffix, skipping")
                continue

            print(f"Validating schema: {file_path}")
            with open(file_path, 'r') as f:
                data = json.load(f)

            try:
                jsonschema.validate(data, schema)
                print(f"✅ {file_path} is valid")
            except jsonschema.ValidationError as e:
                print(f"❌ {file_path} validation failed: {e.message}")
                exit(1)
        EOF